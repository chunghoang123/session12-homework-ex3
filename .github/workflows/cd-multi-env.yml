name: CD Multi Env (Staging & Production)

# Push develop -> deploy staging. Push main -> deploy production (can phe duyet).
on:
  push:
    branches: [ "develop", "main" ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x gradlew
      - run: ./gradlew test

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test
    # Chi chay khi push vao develop.
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://api.staging.example.com
    steps:
      - uses: actions/checkout@v5
      - name: Mo phong deploy staging
        run: |
          echo "Deploying ${{ github.sha }} to STAGING..."
          echo "API URL: https://api.staging.example.com/health"

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    # Chi chay khi push vao main, dung lai cho phe duyet.
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.prod.example.com
    steps:
      - uses: actions/checkout@v5
      - name: Mo phong deploy production
        run: |
          echo "Deploying ${{ github.sha }} to PRODUCTION..."
          echo "API URL: https://api.prod.example.com/health"
